# Backend SONORA su Render (piano gratuito). Il database è su Supabase: vedi docs/DEPLOY.md.
services:
  - type: web
    name: sonora-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false          # stringa "Session pooler" di Supabase
      - key: FRONTEND_ORIGIN
        sync: false          # es. https://sonora-lollo.netlify.app
      - key: STORE_COUNTRY
        value: it
      - key: CHART_COUNTRIES
        value: it,us,gb,es,de
      - key: TRUST_PROXY
        value: "true"
      - key: INGEST_ON_START
        value: "true"
